services:
  postgres:
    image: postgres:16-alpine
    container_name: settlementops-postgres
    environment:
      POSTGRES_USER: settlementops_migrator
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: settlementops_app
    ports:
      - '5434:5432'
    volumes:
      - settlementops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U settlementops_migrator -d settlementops_app']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  settlementops_pgdata:
